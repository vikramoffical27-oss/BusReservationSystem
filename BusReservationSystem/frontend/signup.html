<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>BusGo - Signup</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h2>🚌 Create Account</h2>

        <p style="text-align:center; margin-bottom:25px;">
            Join BusGo and start booking your journey
        </p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="signup()">
            Create Account
        </button>

        <div class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
